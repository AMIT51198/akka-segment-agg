# Akka configuration for segment aggregation pipeline
# Reference: https://doc.akka.io/docs/akka/current/general/configuration.html

akka {
  # Actor system configuration
  actor {
    # Use default dispatcher for most work
    default-dispatcher {
      type = "Dispatcher"
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 2
        parallelism-factor = 2.0
        parallelism-max = 64
      }
    }
  }

  # Streaming configuration
  stream {
    # Buffer sizes for streaming stages
    materializer {
      initial-input-buffer-size = 1
      max-input-buffer-size = 1

      # Throughput tuning: process N elements before yielding to other actors
      dispatcher-shutdown-timeout = 1s
    }
  }

  # Coordinated shutdown (graceful termination)
  coordinated-shutdown {
    # Exit JVM after coordinated shutdown
    exit-jvm = on

    timeout = 30s
  }

  # Logging configuration
  loglevel = "INFO"
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
}

